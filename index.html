<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executive Team Dashboard & Six Functions Overview</title>
<style>
  :root{
    color-scheme: light dark;
    --surface-1: #fcfcfb; --page-plane: #090d16; --text-primary: #ffffff; --text-secondary: #94a3b8;
    --text-muted: #64748b; --gridline: #1e293b; --baseline: #334155; --border: rgba(255,255,255,0.08);
    --series-1: #38bdf8; --series-3: #34d399; --series-6: #10b981; --good: #10b981;
    --warning: #fbbf24; --serious: #f97316; --critical: #e66767; --card-bg: #0f172a;
    --cyan: #06b6d4; --purple: #a855f7; --green: #34d399;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--page-plane); color:var(--text-primary); font-family: system-ui,-apple-system,"Segoe UI",sans-serif; font-size:13.5px; line-height:1.5; padding:16px 24px 80px;}
  .wrap{max-width:1440px; margin:0 auto;}

  /* 全站密碼保護遮罩 */
  #site_lock_overlay {
    position: fixed; inset: 0; background: var(--page-plane); z-index: 99999;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .site-lock-box {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 40px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
  }
  .site-lock-box h2 { font-size: 20px; margin-bottom: 10px; color: var(--cyan); }
  .site-lock-box p { font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.5; }
  .site-lock-box input {
    width: 100%; padding: 12px 16px; margin-bottom: 16px; background: #090d16;
    border: 1px solid var(--border); color: #fff; border-radius: 8px; font-size: 14px; outline: none;
  }
  .site-lock-box input:focus { border-color: var(--cyan); }
  .site-lock-box button {
    background: var(--cyan); color: #090d16; border: none; font-weight: 700;
    padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 14px;
  }
  .site-lock-error { color: var(--critical); font-size: 12px; margin-top: 12px; }

  header.top{margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:16px;}
  header.top h1{font-size:22px; font-weight:800; letter-spacing:-0.02em;}

  /* 頂部公司級總計動態卡片 */
  .company-summary-bar {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;
  }
  .summary-box {
    background: #0d1527; border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3); border-top: 3px solid var(--cyan);
  }
  .summary-box .lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
  .summary-box .val { font-size: 22px; font-weight: 800; color: #fff; }

  .section-title {
    font-size: 16px; font-weight: 700; color: var(--cyan); margin: 24px 0 16px;
    display: flex; align-items: center; gap: 8px; border-left: 4px solid var(--cyan); padding-left: 10px;
  }

  /* 動態卡片網格佈局 */
  .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
  .metric-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
    position: relative; box-shadow: 0 4px 16px rgba(0,0,0,0.3); border-left: 4px solid var(--cyan);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .metric-card.eng { border-left-color: #38bdf8; }
  .metric-card.prod { border-left-color: #a855f7; }
  .metric-card.ops { border-left-color: #34d399; }
  .metric-card.bd { border-left-color: #fbbf24; }
  .metric-card.legal { border-left-color: #ec4899; }
  .metric-card.fin_hr { border-left-color: #06b6d4; }

  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .card-title { font-size: 15px; font-weight: 700; color: #fff; }
  .card-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.06); color: var(--text-secondary); }
  
  .metric-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; background: #070b14; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.04); }
  .stat-item .lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
  .stat-item .val { font-size: 13.5px; font-weight: 700; color: #fff; margin-top: 2px; }

  .talent-review-box {
    background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.08); border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; font-size: 11px;
  }
  .talent-review-box .tr-title { color: var(--cyan); font-weight: 700; margin-bottom: 4px; display: flex; justify-content: space-between; }

  .card-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
  .card-footer { margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 11.5px; color: var(--cyan); font-weight: 600; }

  @media (max-width: 1080px) {
    .cards-grid { grid-template-columns: 1fr; }
    .company-summary-bar { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<!-- 全站密碼保護遮罩 -->
<div id="site_lock_overlay">
  <div class="site-lock-box">
    <h2>🔒 Executive Dashboard 存取驗證</h2>
    <p>此 Executive Team Dashboard 包含機密資料，請輸入全站存取密碼以繼續。</p>
    <input type="password" id="site_pwd_input" placeholder="請輸入密碼 (預設: 5678)..." onkeydown="if(event.key==='Enter') verifySitePassword()">
    <button onclick="verifySitePassword()">進入系統</button>
    <div id="site_lock_error" class="site-lock-error"></div>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Executive Team Dashboard — 六大職能部門動態總覽</h1>
    </div>
  </header>

  <!-- 公司級總計動態數據條 -->
  <div class="company-summary-bar">
    <div class="summary-box">
      <div class="lbl">公司總編制 (現有 / 含新招)</div>
      <div class="val" id="sum_hc">0 / 0 人</div>
    </div>
    <div class="summary-box" style="border-top-color: var(--green);">
      <div class="lbl">現有年度總薪酬預算</div>
      <div class="val" id="sum_budget" style="color:var(--green);">$0</div>
    </div>
    <div class="summary-box" style="border-top-color: var(--warning);">
      <div class="lbl">招募擴編預算影響</div>
      <div class="val" id="sum_hire_cost" style="color:var(--warning);">+$0</div>
    </div>
    <div class="summary-box" style="border-top-color: var(--critical);">
      <div class="lbl">人才風險池 (Box 9/6 PIP)</div>
      <div class="val" id="sum_pip" style="color:var(--critical);">0 人</div>
    </div>
  </div>

  <div class="section-title">🏢 六大核心職能部門即時動態與人才盤點摘要</div>

  <!-- 六大部門動態卡片網格 -->
  <div class="cards-grid" id="departmentsGrid"></div>
</div>

<script>
const SITE_PASSWORD = "5678";

function verifySitePassword() {
  const inputVal = document.getElementById('site_pwd_input').value.trim();
  const errorEl = document.getElementById('site_lock_error');
  
  if (inputVal === SITE_PASSWORD) {
    document.getElementById('site_lock_overlay').style.display = 'none';
    sessionStorage.setItem('site_unlocked', 'true');
    renderDashboard();
  } else {
    errorEl.innerText = "⚠️ 密碼錯誤，請重新輸入（預設: 5678）！";
  }
}

window.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('site_unlocked') === 'true') {
    document.getElementById('site_lock_overlay').style.display = 'none';
    renderDashboard();
  }
});

// 六大職能部門動態資料來源
const departmentsData = [
  {
    id: 'eng',
    name: '研發工程 (Engineering)',
    badge: 'T2 Benchmark',
    baseHc: 15,
    newHires: 3,
    baseBudget: 1552500,
    hireCost: 228000,
    star: 3,
    highPot: 4,
    pip: 2,
    desc: '主導全球核心清算架構高併發重構，擴編 3 名 Staff/Senior 級別支援 24/7 SRE 自動化自愈體系與 SOC2 審計。',
    goal: '🎯 戰略目標：99.99% 高可用性與延遲降低 40%'
  },
  {
    id: 'prod',
    name: '產品管理 (Product Management)',
    badge: 'T1-T2 Mix',
    baseHc: 8,
    newHires: 1,
    baseBudget: 980000,
    hireCost: 140000,
    star: 2,
    highPot: 3,
    pip: 1,
    desc: '推進跨國本地化產品體驗與多幣種資金池路由協議設計，強化用戶旅程轉化率與產品矩陣 ROI。',
    goal: '🎯 戰略目標：全球支付與交易生態系閉環'
  },
  {
    id: 'ops',
    name: '營運管理 (Operations)',
    badge: 'Global Ops',
    baseHc: 12,
    newHires: 2,
    baseBudget: 1120000,
    hireCost: 165000,
    star: 2,
    highPot: 4,
    pip: 1,
    desc: '落實跨國清算自動化降本，優化單位營運成本（Unit Cost）與 24/7 通道異常極速應變機制。',
    goal: '🎯 戰略目標：營運自動化覆蓋率達 85%'
  },
  {
    id: 'bd',
    name: '商務與銷售 (BD & Sales)',
    badge: 'Growth Driver',
    baseHc: 10,
    newHires: 2,
    baseBudget: 1350000,
    hireCost: 210000,
    star: 3,
    highPot: 3,
    pip: 2,
    desc: '聚焦大區 Top 機構客戶攻堅與戰略大單成交，優化獲客成本（CAC）並擴展全球商業版圖。',
    goal: '🎯 戰略目標：大中華與亞太區營收 Quota 達成'
  },
  {
    id: 'legal',
    name: '法務與合規 (Legal & Compliance)',
    badge: 'Risk Defense',
    baseHc: 6,
    newHires: 1,
    baseBudget: 890000,
    hireCost: 150000,
    star: 1,
    highPot: 2,
    pip: 0,
    desc: '對接多國牌照申請與 AML 監管審計，強化跨國子公司合規架構與涉訴防禦最高防線。',
    goal: '🎯 戰略目標：零重大監管罰單與牌照全覆蓋'
  },
  {
    id: 'fin_hr',
    name: '財務與人資 (Finance & HR)',
    badge: 'Governance',
    baseHc: 8,
    newHires: 1,
    baseBudget: 950000,
    hireCost: 110000,
    star: 2,
    highPot: 3,
    pip: 1,
    desc: '確保四大會計師事務所無保留意見審查，推動 L3-L8 雙軌職涯階梯落地與跨國人效優化。',
    goal: '🎯 戰略目標：月結週期壓縮至 T+2 與海外資本佈局'
  }
];

function renderDashboard() {
  const gridEl = document.getElementById('departmentsGrid');
  if (!gridEl) return;

  let totalBaseHc = 0;
  let totalNewHc = 0;
  let totalBaseBudget = 0;
  let totalHireCost = 0;
  let totalPip = 0;

  gridEl.innerHTML = departmentsData.map(d => {
    totalBaseHc += d.baseHc;
    totalNewHc += d.newHires;
    totalBaseBudget += d.baseBudget;
    totalHireCost += d.hireCost;
    totalPip += d.pip;

    const finalHc = d.baseHc + d.newHires;
    const finalBudget = d.baseBudget + d.hireCost;

    return `
      <div class="metric-card ${d.id}">
        <div>
          <div class="card-header">
            <div class="card-title">${d.name}</div>
            <div class="card-badge">${d.badge}</div>
          </div>
          <div class="metric-stats">
            <div class="stat-item"><div class="lbl">現有 / 新招編制</div><div class="val" style="color:var(--cyan);">${d.baseHc} 人 <span style="color:var(--green); font-size:11px;">(+${d.newHires})</span></div></div>
            <div class="stat-item"><div class="lbl">擴編後總人數</div><div class="val" style="color:#fff;">${finalHc} 人</div></div>
            <div class="stat-item"><div class="lbl">現有年度預算</div><div class="val" style="color:var(--text-secondary);">$${d.baseBudget.toLocaleString()}</div></div>
            <div class="stat-item"><div class="lbl">擴編後總預算</div><div class="val" style="color:var(--green);">$${finalBudget.toLocaleString()}</div></div>
          </div>
          <div class="talent-review-box">
            <div class="tr-title"><span>👥 人才盤點 (9-Box)</span><span>總計 ${finalHc} 人</span></div>
            <div style="color:var(--text-secondary);">⭐ Star (Box 1): <b>${d.star} 人</b> | 🚀 High Pot: <b>${d.highPot} 人</b> | ⚠️ PIP Pool: <b style="color:var(--critical);">${d.pip} 人</b></div>
          </div>
          <div class="card-desc"><b>核心動態：</b>${d.desc}</div>
        </div>
        <div class="card-footer">${d.goal}</div>
      </div>
    `;
  }).join('');

  // 渲染頂部公司級總計數據
  document.getElementById('sum_hc').innerText = `${totalBaseHc} / ${totalBaseHc + totalNewHc} 人`;
  document.getElementById('sum_budget').innerText = `$${totalBaseBudget.toLocaleString()}`;
  document.getElementById('sum_hire_cost').innerText = `+$${totalHireCost.toLocaleString()} (+${((totalHireCost/totalBaseBudget)*100).toFixed(1)}%)`;
  document.getElementById('sum_pip').innerText = `${totalPip} 人`;
}
</script>
</body>
</html>
