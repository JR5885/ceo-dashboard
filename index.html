<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executive Team Dashboard & Six Functions Overview</title>
<style>
  :root{
    color-scheme: light dark;
    --surface-1: #fcfcfb; --page-plane: #090d16; --text-primary: #ffffff; --text-secondary: #94a3b8;
    --text-muted: #64748b; --gridline: #1e293b; --baseline: #334155; --border: rgba(255,255,255,0.08);
    --series-1: #38bdf8; --series-3: #34d399; --series-6: #10b981; --good: #10b981;
    --warning: #fbbf24; --serious: #f97316; --critical: #e66767; --card-bg: #0f172a;
    --cyan: #06b6d4; --purple: #a855f7; --green: #34d399;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--page-plane); color:var(--text-primary); font-family: system-ui,-apple-system,"Segoe UI",sans-serif; font-size:13.5px; line-height:1.5; padding:16px 24px 80px;}
  .wrap{max-width:1440px; margin:0 auto;}

  /* 全站密碼保護遮罩 */
  #site_lock_overlay {
    position: fixed; inset: 0; background: var(--page-plane); z-index: 99999;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .site-lock-box {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 40px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
  }
  .site-lock-box h2 { font-size: 20px; margin-bottom: 10px; color: var(--cyan); }
  .site-lock-box p { font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.5; }
  .site-lock-box input {
    width: 100%; padding: 12px 16px; margin-bottom: 16px; background: #090d16;
    border: 1px solid var(--border); color: #fff; border-radius: 8px; font-size: 14px; outline: none;
  }
  .site-lock-box input:focus { border-color: var(--cyan); }
  .site-lock-box button {
    background: var(--cyan); color: #090d16; border: none; font-weight: 700;
    padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 14px;
  }
  .site-lock-error { color: var(--critical); font-size: 12px; margin-top: 12px; }

  header.top{margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:16px;}
  header.top h1{font-size:22px; font-weight:800; letter-spacing:-0.02em;}

  /* 語言切換按鈕列 */
  .lang-switcher { display: inline-flex; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 3px; gap: 2px; }
  .lang-btn { background: none; border: none; color: var(--text-muted); padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 6px; transition: all .15s; }
  .lang-btn.active { background: var(--cyan); color: #090d16; }

  .company-summary-bar {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;
  }
  .summary-box {
    background: #0d1527; border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3); border-top: 3px solid var(--cyan);
  }
  .summary-box .lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
  .summary-box .val { font-size: 22px; font-weight: 800; color: #fff; }

  .section-title {
    font-size: 16px; font-weight: 700; color: var(--cyan); margin: 24px 0 16px;
    display: flex; align-items: center; gap: 8px; border-left: 4px solid var(--cyan); padding-left: 10px;
  }

  .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
  .metric-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
    position: relative; box-shadow: 0 4px 16px rgba(0,0,0,0.3); border-left: 4px solid var(--cyan);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .metric-card.eng { border-left-color: #38bdf8; }
  .metric-card.prod { border-left-color: #a855f7; }
  .metric-card.ops { border-left-color: #34d399; }
  .metric-card.bd { border-left-color: #fbbf24; }
  .metric-card.legal { border-left-color: #ec4899; }
  .metric-card.fin_hr { border-left-color: #06b6d4; }

  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .card-title { font-size: 15px; font-weight: 700; color: #fff; }
  .card-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.06); color: var(--text-secondary); }
  
  .metric-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; background: #070b14; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.04); }
  .stat-item .lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
  .stat-item .val { font-size: 13px; font-weight: 700; color: #fff; margin-top: 2px; }

  .level-pipeline-box {
    background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; font-size: 11px;
  }
  .box-sub-title { color: var(--cyan); font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .level-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
  .level-tag { background: #090d16; border: 1px solid var(--border); border-radius: 4px; padding: 2px 5px; font-size: 10px; color: var(--text-secondary); }
  
  .pipeline-bar-row { display: grid; grid-template-columns: 85px 1fr 30px; align-items: center; gap: 6px; font-size: 10px; margin-bottom: 3px; }
  .pipeline-track { height: 6px; background: #090d16; border-radius: 3px; overflow: hidden; }
  .pipeline-fill { height: 100%; background: var(--series-1); border-radius: 3px; }

  .talent-review-box {
    background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.08); border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; font-size: 11px;
  }
  .talent-review-box .tr-title { color: var(--cyan); font-weight: 700; margin-bottom: 4px; display: flex; justify-content: space-between; }

  .card-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
  .card-footer { margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 11.5px; color: var(--cyan); font-weight: 600; }

  /* 雙語對照樣式 */
  .bi-text { display: flex; flex-direction: column; gap: 2px; }
  .bi-en { color: #fff; font-weight: 600; }
  .bi-zh { color: var(--text-secondary); font-size: 11.5px; border-left: 2px solid var(--cyan); padding-left: 6px; margin-top: 2px; }

  @media (max-width: 1080px) {
    .cards-grid { grid-template-columns: 1fr; }
    .company-summary-bar { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<!-- 全站密碼保護遮罩 -->
<div id="site_lock_overlay">
  <div class="site-lock-box">
    <h2>🔒 Executive Dashboard 存取驗證</h2>
    <p>此 Executive Team Dashboard 包含機密資料，請輸入全站存取密碼以繼續。</p>
    <input type="password" id="site_pwd_input" placeholder="請輸入密碼 (預設: 5678)..." onkeydown="if(event.key==='Enter') verifySitePassword()">
    <button onclick="verifySitePassword()">進入系統</button>
    <div id="site_lock_error" class="site-lock-error"></div>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <div>
      <h1 id="page_main_title">Executive Team Dashboard — 六大職能部門動態總覽</h1>
    </div>
    <!-- 語言切換選單 (EN / 繁中 / 雙語對照) -->
    <div class="lang-switcher">
      <button class="lang-btn" id="btn_en" onclick="setLang('en')">English</button>
      <button class="lang-btn" id="btn_zh" onclick="setLang('zh')">繁體中文</button>
      <button class="lang-btn active" id="btn_bi" onclick="setLang('bi')">Bilingual (雙語對照)</button>
    </div>
  </header>

  <!-- 公司級總計動態數據條 -->
  <div class="company-summary-bar">
    <div class="summary-box">
      <div class="lbl" id="lbl_sum_hc">公司總編制 (現有 / 含新招)</div>
      <div class="val" id="sum_hc">59 / 68 人 (+15.3%)</div>
    </div>
    <div class="summary-box" style="border-top-color: var(--green);">
      <div class="lbl" id="lbl_sum_budget">現有年度總薪酬預算</div>
      <div class="val" id="sum_budget" style="color:var(--green);">$6,892,500</div>
    </div>
    <div class="summary-box" style="border-top-color: var(--warning);">
      <div class="lbl" id="lbl_sum_hire">預計增加總預算影響</div>
      <div class="val" id="sum_hire_cost" style="color:var(--warning);">+$1,095,000 (+15.9%)</div>
    </div>
    <div class="summary-box" style="border-top-color: var(--critical);">
      <div class="lbl" id="lbl_sum_pip">人才風險池 (Box 9/6 PIP)</div>
      <div class="val" id="sum_pip" style="color:var(--critical);">7 人</div>
    </div>
  </div>

  <div class="section-title" id="sec_title_text">🏢 六大核心職能部門即時動態與職級/管道分析</div>

  <!-- 六大部門動態卡片網格 -->
  <div class="cards-grid" id="departmentsGrid"></div>
</div>

<script>
const SITE_PASSWORD = "5678";

function verifySitePassword() {
  const inputVal = document.getElementById('site_pwd_input').value.trim();
  const errorEl = document.getElementById('site_lock_error');
  
  if (inputVal === SITE_PASSWORD) {
    document.getElementById('site_lock_overlay').style.display = 'none';
    sessionStorage.setItem('site_unlocked', 'true');
    renderDashboard();
  } else {
    errorEl.innerText = "⚠️ 密碼錯誤，請重新輸入（預設: 5678）！";
  }
}

window.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('site_unlocked') === 'true') {
    document.getElementById('site_lock_overlay').style.display = 'none';
    renderDashboard();
  }
});

let currentLang = 'bi'; // 預設為雙語對照模式

function setLang(lang) {
  currentLang = lang;
  document.getElementById('btn_en').className = `lang-btn ${lang==='en'?'active':''}`;
  document.getElementById('btn_zh').className = `lang-btn ${lang==='zh'?'active':''}`;
  document.getElementById('btn_bi').className = `lang-btn ${lang==='bi'?'active':''}`;
  renderDashboard();
}

// 六大職能部門資料（內含中英文雙語文字）
const departmentsData = [
  {
    id: 'eng',
    name: { en: 'Engineering', zh: '研發工程' },
    badge: 'T2 Benchmark',
    baseHc: 15, newHires: 3, baseBudget: 1552500, hireCost: 228000,
    levels: { L3: 4, L4: 6, L5: 3, L6: 1, L7: 1, L8: 0 },
    pipeline: { hr: 24, tech: 12, lm: 6, offer: 1 },
    star: 3, highPot: 4, pip: 2,
    desc: {
      en: 'Spearheading core high-concurrency clearing architecture refactoring; expanding 3 Staff/Senior headcount for 24/7 SRE auto-healing & SOC2 audit.',
      zh: '主導全球核心清算架構高併發重構，擴編 3 名 Staff/Senior 級別支援 24/7 SRE 自動化自愈體系與 SOC2 審計。'
    },
    goal: { en: 'Strategic Goal: 99.99% Availability & -40% Latency', zh: '戰略目標：99.99% 高可用性與延遲降低 40%' }
  },
  {
    id: 'prod',
    name: { en: 'Product Management', zh: '產品管理' },
    badge: 'T1-T2 Mix',
    baseHc: 8, newHires: 1, baseBudget: 980000, hireCost: 140000,
    levels: { L3: 2, L4: 3, L5: 2, L6: 1, L7: 0, L8: 0 },
    pipeline: { hr: 14, tech: 8, lm: 3, offer: 1 },
    star: 2, highPot: 3, pip: 1,
    desc: {
      en: 'Driving internationalized UX localization and multi-currency liquidity pool routing design to boost conversion metrics and portfolio ROI.',
      zh: '推進跨國本地化產品體驗與多幣種資金池路由協議設計，強化用戶旅程轉化率與產品矩陣 ROI。'
    },
    goal: { en: 'Strategic Goal: Global Payment & Trading Ecosystem Closed-Loop', zh: '戰略目標：全球支付與交易生態系閉環' }
  },
  {
    id: 'ops',
    name: { en: 'Operations', zh: '營運管理' },
    badge: 'Global Ops',
    baseHc: 12, newHires: 2, baseBudget: 1120000, hireCost: 165000,
    levels: { L3: 4, L4: 5, L5: 2, L6: 1, L7: 0, L8: 0 },
    pipeline: { hr: 18, tech: 10, lm: 4, offer: 1 },
    star: 2, highPot: 4, pip: 1,
    desc: {
      en: 'Executing cross-border clearing automation to drive unit cost down and strengthen 24/7 incident response SLA defense.',
      zh: '落實跨國清算自動化降本，優化單位營運成本（Unit Cost）與 24/7 通道異常極速應變機制。'
    },
    goal: { en: 'Strategic Goal: 85% Workflow Automation Coverage', zh: '戰略目標：營運自動化覆蓋率達 85%' }
  },
  {
    id: 'bd',
    name: { en: 'BD & Sales', zh: '商務與銷售' },
    badge: 'Growth Driver',
    baseHc: 10, newHires: 2, baseBudget: 1350000, hireCost: 210000,
    levels: { L3: 3, L4: 4, L5: 2, L6: 1, L7: 0, L8: 0 },
    pipeline: { hr: 20, tech: 10, lm: 5, offer: 2 },
    star: 3, highPot: 3, pip: 2,
    desc: {
      en: 'Targeting top-tier regional institutional accounts, high-stakes deal closing, and optimizing client acquisition cost (CAC).',
      zh: '聚焦大區 Top 機構客戶攻堅與戰略大單成交，優化獲客成本（CAC）並擴展全球商業版圖。'
    },
    goal: { en: 'Strategic Goal: Greater China & APAC Quota Attainment', zh: '戰略目標：大中華與亞太區營收 Quota 達成' }
  },
  {
    id: 'legal',
    name: { en: 'Legal & Compliance', zh: '法務與合規' },
    badge: 'Risk Defense',
    baseHc: 6, newHires: 1, baseBudget: 890000, hireCost: 150000,
    levels: { L3: 1, L4: 2, L5: 2, L6: 1, L7: 0, L8: 0 },
    pipeline: { hr: 8, tech: 4, lm: 2, offer: 1 },
    star: 1, highPot: 2, pip: 0,
    desc: {
      en: 'Managing regulatory licensing filings and AML audits; establishing enterprise legal risk mitigation and litigation defense lines.',
      zh: '對接多國牌照申請與 AML 監管審計，強化跨國子公司合規架構與涉訴防禦最高防線。'
    },
    goal: { en: 'Strategic Goal: Zero Regulatory Penalties & Full Licensing', zh: '戰略目標：零重大監管罰單與牌照全覆蓋' }
  },
  {
    id: 'fin_hr',
    name: { en: 'Finance & HR', zh: '財務與人資' },
    badge: 'Governance',
    baseHc: 8, newHires: 1, baseBudget: 950000, hireCost: 110000,
    levels: { L3: 2, L4: 3, L5: 2, L6: 0, L7: 1, L8: 0 },
    pipeline: { hr: 10, tech: 5, lm: 2, offer: 1 },
    star: 2, highPot: 3, pip: 1,
    desc: {
      en: 'Securing Big 4 clean audit sign-off; rolling out L3-L8 dual-track career ladders and cross-border headcount efficiency.',
      zh: '確保四大會計師事務所無保留意見審查，推動 L3-L8 雙軌職涯階梯落地與跨國人效優化。'
    },
    goal: { en: 'Strategic Goal: T+2 Month-End Close & Capital Treasury', zh: '戰略目標：月結週期壓縮至 T+2 與海外資本佈局' }
  }
];

function formatText(item) {
  if (currentLang === 'en') return `<span class="bi-en">${item.en}</span>`;
  if (currentLang === 'zh') return `<span class="bi-zh" style="border-left:none; padding-left:0;">${item.zh}</span>`;
  return `<div class="bi-text"><span class="bi-en">${item.en}</span><span class="bi-zh">${item.zh}</span></div>`;
}

function renderDashboard() {
  const gridEl = document.getElementById('departmentsGrid');
  if (!gridEl) return;

  // 更新頂部標題文字
  if (currentLang === 'en') {
    document.getElementById('page_main_title').innerText = "Executive Team Dashboard — Six Functions Overview";
    document.getElementById('lbl_sum_hc').innerText = "Total Headcount (Current / New)";
    document.getElementById('lbl_sum_budget').innerText = "Current Annual Payroll Budget";
    document.getElementById('lbl_sum_hire').innerText = "Estimated Hiring Budget Impact";
    document.getElementById('lbl_sum_pip').innerText = "Talent Risk Pool (Box 9/6 PIP)";
    document.getElementById('sec_title_text').innerText = "🏢 Six Core Functional Departments Real-Time Dynamics & Pipeline Analysis";
  } else if (currentLang === 'zh') {
    document.getElementById('page_main_title').innerText = "高階管理團隊看板 — 六大職能部門動態總覽";
    document.getElementById('lbl_sum_hc').innerText = "公司總編制 (現有 / 含新招)";
    document.getElementById('lbl_sum_budget').innerText = "現有年度總薪酬預算";
    document.getElementById('lbl_sum_hire').innerText = "預計增加總預算影響";
    document.getElementById('lbl_sum_pip').innerText = "人才風險池 (Box 9/6 PIP)";
    document.getElementById('sec_title_text').innerText = "🏢 六大核心職能部門即時動態與職級/管道分析";
  } else {
    document.getElementById('page_main_title').innerText = "Executive Team Dashboard — 六大職能部門動態總覽";
    document.getElementById('lbl_sum_hc').innerText = "Total Headcount (Current / New) | 公司總編制";
    document.getElementById('lbl_sum_budget').innerText = "Annual Payroll Budget | 現有年度總薪酬預算";
    document.getElementById('lbl_sum_hire').innerText = "Hiring Budget Impact | 預計增加總預算影響";
    document.getElementById('lbl_sum_pip').innerText = "Talent Risk Pool (PIP) | 人才風險池";
    document.getElementById('sec_title_text').innerText = "🏢 Six Core Functional Departments Dynamics & Pipeline Analysis (六大職能部門即時動態與分析)";
  }

  let totalBaseHc = 0, totalNewHc = 0, totalBaseBudget = 0, totalHireCost = 0, totalPip = 0;

  gridEl.innerHTML = departmentsData.map(d => {
    totalBaseHc += d.baseHc;
    totalNewHc += d.newHires;
    totalBaseBudget += d.baseBudget;
    totalHireCost += d.hireCost;
    totalPip += d.pip;

    const finalHc = d.baseHc + d.newHires;
    const finalBudget = d.baseBudget + d.hireCost;
    const hcGrowthPct = ((d.newHires / d.baseHc) * 100).toFixed(1);
    const budgetGrowthPct = ((d.hireCost / d.baseBudget) * 100).toFixed(1);
    const maxPipe = Math.max(d.pipeline.hr, 1);

    const lblCurrent = currentLang==='en'?'Current HC':'現有編制';
    const lblNew = currentLang==='en'?'New Hires':'新招募編制';
    const lblBaseBud = currentLang==='en'?'Current Budget':'現有年度預算';
    const lblIncBud = currentLang==='en'?'Budget Impact':'預計增加預算';
    const lblLevels = currentLang==='en'?'📊 Level Distribution (L3 - L8)':'📊 職級分佈 (L3 - L8)';
    const lblPipe = currentLang==='en'?'🔎 Recruiting Pipeline':'🔎 招募 Pipeline';
    const lblReview = currentLang==='en'?'👥 Talent Review (9-Box)':'👥 人才盤點 (9-Box)';

    return `
      <div class="metric-card ${d.id}">
        <div>
          <div class="card-header">
            <div class="card-title">${formatText(d.name)}</div>
            <div class="card-badge">${d.badge}</div>
          </div>
          
          <div class="metric-stats">
            <div class="stat-item">
              <div class="lbl">${lblCurrent}</div>
              <div class="val" style="color:var(--cyan);">${d.baseHc} HC / 人</div>
            </div>
            <div class="stat-item">
              <div class="lbl">${lblNew}</div>
              <div class="val" style="color:var(--green);">+${d.newHires} (+${hcGrowthPct}%)</div>
            </div>
            <div class="stat-item">
              <div class="lbl">${lblBaseBud}</div>
              <div class="val" style="color:var(--text-secondary);">$${d.baseBudget.toLocaleString()}</div>
            </div>
            <div class="stat-item">
              <div class="lbl">${lblIncBud}</div>
              <div class="val" style="color:var(--warning);">+$${d.hireCost.toLocaleString()} (+${budgetGrowthPct}%)</div>
            </div>
          </div>

          <!-- 職級序列與 PIPELINE 圖表 -->
          <div class="level-pipeline-box">
            <div class="box-sub-title"><span>${lblLevels}</span><span>Total: ${finalHc}</span></div>
            <div class="level-tags">
              <span class="level-tag">L3: <b>${d.levels.L3}</b></span>
              <span class="level-tag">L4: <b>${d.levels.L4}</b></span>
              <span class="level-tag">L5(M1): <b>${d.levels.L5}</b></span>
              <span class="level-tag">L6(M2): <b>${d.levels.L6}</b></span>
              <span class="level-tag">L7(M3): <b>${d.levels.L7}</b></span>
              <span class="level-tag">L8(M4): <b>${d.levels.L8}</b></span>
            </div>
            <div class="box-sub-title" style="margin-top:8px;"><span>${lblPipe}</span><span>(HR ➔ Offer)</span></div>
            <div class="pipeline-bar-row">
              <div class="lbl">HR Screen</div>
              <div class="pipeline-track"><div class="pipeline-fill" style="width: ${Math.round(d.pipeline.hr/maxPipe*100)}%;"></div></div>
              <div class="val">${d.pipeline.hr}</div>
            </div>
            <div class="pipeline-bar-row">
              <div class="lbl">Tech Screen</div>
              <div class="pipeline-track"><div class="pipeline-fill" style="width: ${Math.round(d.pipeline.tech/maxPipe*100)}%; background:var(--cyan);"></div></div>
              <div class="val">${d.pipeline.tech}</div>
            </div>
            <div class="pipeline-bar-row">
              <div class="lbl">Line Mgr</div>
              <div class="pipeline-track"><div class="pipeline-fill" style="width: ${Math.round(d.pipeline.lm/maxPipe*100)}%; background:var(--purple);"></div></div>
              <div class="val">${d.pipeline.lm}</div>
            </div>
            <div class="pipeline-bar-row">
              <div class="lbl">Offer</div>
              <div class="pipeline-track"><div class="pipeline-fill" style="width: ${Math.round(d.pipeline.offer/maxPipe*100)}%; background:var(--green);"></div></div>
              <div class="val">${d.pipeline.offer}</div>
            </div>
          </div>

          <div class="talent-review-box">
            <div class="tr-title"><span>${lblReview}</span><span>Total ${finalHc} HC</span></div>
            <div style="color:var(--text-secondary);">⭐ Star (Box 1): <b>${d.star}</b> | 🚀 High Pot: <b>${d.highPot}</b> | ⚠️ PIP Pool: <b style="color:var(--critical);">${d.pip}</b></div>
          </div>

          <div class="card-desc"><b>Context: </b>${formatText(d.desc)}</div>
        </div>
        <div class="card-footer">${formatText(d.goal)}</div>
      </div>
    `;
  }).join('');

  // 渲染頂部公司級總計數據
  const totalHcGrowth = ((totalNewHc / totalBaseHc) * 100).toFixed(1);
  const totalBudgetGrowth = ((totalHireCost / totalBaseBudget) * 100).toFixed(1);

  document.getElementById('sum_hc').innerText = `${totalBaseHc} / ${totalBaseHc + totalNewHc} 人 (+${totalHcGrowth}%)`;
  document.getElementById('sum_budget').innerText = `$${totalBaseBudget.toLocaleString()}`;
  document.getElementById('sum_hire_cost').innerText = `+$${totalHireCost.toLocaleString()} (+${totalBudgetGrowth}%)`;
  document.getElementById('sum_pip').innerText = `${totalPip} 人`;
}
</script>
</body>
</html>
